# SplatCraft defaults. Presets (smoke.yaml, quick.yaml, full.yaml) override any key below.
# Learning rates and densification schedule follow Kerbl et al. 2023 (3D Gaussian Splatting).

data:
  max_width: 800          # training resolution: images are resized to at most this width
  test_every: 8           # COLMAP scenes: every 8th image is held out for evaluation (LLFF protocol)
  max_images: 0           # 0 = all registered images
  random_init: 100000     # scenes without SfM points (NeRF-synthetic): random initial Gaussians (3DGS: 100k)

train:
  iterations: 30000
  sh_degree: 3            # spherical-harmonic degree of view-dependent colour (16 coeffs per channel)
  sh_increase_every: 1000 # start at degree 0 and add one band every N iterations
  lambda_dssim: 0.2       # loss = (1 - l) * L1 + l * (1 - SSIM)
  init_opacity: 0.1
  random_background: false
  seed: 0
  max_gaussians: 600000   # hard cap (6 GB GPUs); densification keeps the hottest candidates beyond it
  slab: 32                # rasterizer: Gaussians composited per batched step
  slab_budget: 6000000    # rasterizer: max (tiles x slab x 256) elements per step (memory knob)
  lr:
    means: 1.6e-4         # x scene extent, decays exponentially to means_final
    means_final: 1.6e-6
    log_scales: 0.005
    quats: 0.001
    opacity_logits: 0.025
    sh_dc: 0.0025
    sh_rest: 0.000125     # sh_dc / 20

densify:
  start: 500
  stop: 15000
  every: 100
  grad_threshold: 0.0001  # mean NDC-space positional gradient that triggers clone / split (3DGS: 2e-4;
                          # 1e-4 scored +1.9 dB on lego here, see benchmarks/results/ablation.md)
  percent_dense: 0.01     # clone if max scale <= 1% of the scene extent, split otherwise
  min_opacity: 0.005
  opacity_reset_every: 3000
  screen_size_after: 3000 # from then on also prune Gaussians larger than max_screen pixels
  max_screen: 20

compaction:                # importance pruning during training (LightGaussian-style global significance)
  at: [16000]             # iterations at which to prune; [] disables
  keep: 0.6               # fraction of Gaussians kept (by summed blend weight over all training views)

compress:
  prune_keep: 1.0         # extra importance pruning at compression time (1.0 = keep all)
  min_opacity: 0.004
  position_bits: 16       # per axis, after Morton ordering, delta + rANS coded
  sh_codebook: 4096       # VQ codebook size for the 45 higher-order SH coefficients
  sh_codebook_dim: 15x3
  geo_codebook: 0         # 0 = quantise scale/rotation directly (8+8 bits); >0 = VQ codebook size
  scale_bits: 8
  rotation_bits: 8
  color_bits: 8
  opacity_bits: 8
  kmeans_iters: 15
  chunks: 6               # progressive levels (most important Gaussians first)
  entropy: rans           # rans | deflate | none

eval:
  lpips_net: vgg          # LPIPS backbone (vgg matches the 3DGS paper tables)
  max_test_views: 0       # 0 = all held-out views
